<div fxFlex="100" fxLayout="row wrap" fxLayoutAlign="start stretch">
  <div fxFlex="100" fxLayout="row wrap" fxLayoutAlign="end center" fxLayoutGap="20" class="mb-1">
    <button [disabled]="selection.selected.length==0" mat-button class="btn-add" style="color: black"
      (click)="onPrint()">
      <img src="assets/img/report/printer.png" class="btn-img-add" />
      PRINT PDF
    </button>
  </div>

  <div fxFlex="100" fxLayout="row wrap" fxLayoutAlign="start center" class="mt-1 overflow-auto box-glass ">
    <table fxFlex="100" mat-table [dataSource]="dataSource" matSort matSortActive="reportNo" matSortDirection="desc" class="mat-elevation-z8 table-custom">

      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          <mat-checkbox (change)="$event ? toggleAllRows() : null" [checked]="selection.hasValue() && isAllSelected()"
            [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
            [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
          </mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="reportNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> Report No </th>
        <td mat-cell *matCellDef="let row">
          <span class="text-blue-500 cursor-pointer">{{row.reportNo}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="report">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> Report </th>
        <td mat-cell *matCellDef="let row">
          <span>{{row.report}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> Type </th>
        <td mat-cell *matCellDef="let row">
          <span>{{row.type}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> CreatedAt </th>
        <td mat-cell *matCellDef="let row"> {{row.createdAt}} </td>
      </ng-container>

      <ng-container matColumnDef="province">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> province </th>
        <td mat-cell *matCellDef="let row"> {{row.province}} </td>
      </ng-container>

      <ng-container matColumnDef="customer">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> customer </th>
        <td mat-cell *matCellDef="let row"> {{row.customer}} </td>
      </ng-container>

      <ng-container matColumnDef="machine">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> machine </th>
        <td mat-cell *matCellDef="let row"> {{row.machine}} </td>
      </ng-container>

      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> model </th>
        <td mat-cell *matCellDef="let row"> {{row.model}} </td>
      </ng-container>

      <ng-container matColumnDef="serviceType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-black capitalize"> Service </th>
        <td mat-cell *matCellDef="let row"> {{row.serviceType}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell class="gap" *matCellDef="let row" class="font-semibold capitalize"
          [ngClass]="{setColorGreen: row.status == 'finish'}" style="letter-spacing: 2px;">
          <span *ngIf="row.status!=='finish'">
            {{row.status}}
          </span>
          <span *ngIf="row.status=='finish'">
            Finished
          </span>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
      </tr>
    </table>
  </div>
  <div fxFlex="100" fxLayout="row wrap" fxLayoutAlign="space-between center">
    <mat-paginator fxFlex="100" [pageSizeOptions]="[5, 10, 25, 100,dataSource.filteredData.length]"
      aria-label="Select page of users"></mat-paginator>
  </div>
</div>
